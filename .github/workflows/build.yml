name: KeeAnywhere Build

# Build check for every push/PR on master, release build for tags v* (with real API keys).
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    # Single source of truth: AssemblyInformationalVersion in AssemblyInfo.cs
    - name: Determine version
      id: version
      run: |
        $m = Select-String -Path KeeAnywhere\Properties\AssemblyInfo.cs -Pattern '^\[assembly: AssemblyInformationalVersion\("([^"]+)"\)\]'
        if (-not $m) { throw "AssemblyInformationalVersion not found in AssemblyInfo.cs" }
        $version = $m.Matches[0].Groups[1].Value
        $release = "${{ github.ref_type }}" -eq "tag"
        if ($release -and "${{ github.ref_name }}" -ne "v$version") {
          throw "Tag ${{ github.ref_name }} does not match version $version in AssemblyInfo.cs"
        }
        $artifact = if ($release) { "KeeAnywhere-$version" } else { "KeeAnywhere-$version-dummy-keys" }
        "version=$version" >> $env:GITHUB_OUTPUT
        "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        "artifact=$artifact" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version, release build: $release"

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: packages
        key: nuget-${{ hashFiles('KeeAnywhere/packages.config') }}

    - name: Restore packages
      run: msbuild KeeAnywhere.sln -t:restore -p:RestorePackagesConfig=true

    # Release builds only: ApiKeys.cs from secret KEEANYWHERE_API_KEYS (complete file content).
    # All other builds use ApiKeys.Template.cs (dummy keys), created by the build automatically.
    - name: Create ApiKeys.cs (release build)
      if: steps.version.outputs.release == 'true'
      env:
        API_KEYS: ${{ secrets.KEEANYWHERE_API_KEYS }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:API_KEYS)) { throw "Secret KEEANYWHERE_API_KEYS is missing - release build would contain dummy keys." }
        if ($env:API_KEYS -match '"dummy"') { throw "Secret KEEANYWHERE_API_KEYS still contains dummy keys." }
        [System.IO.File]::WriteAllText("$PWD\KeeAnywhere\ApiKeys.cs", $env:API_KEYS, (New-Object System.Text.UTF8Encoding($true)))
        Write-Host "ApiKeys.cs created from secret."

    - name: Build solution
      run: |
        New-Item -ItemType Directory -Force -Path build\dist | Out-Null
        msbuild KeeAnywhere.sln /p:Configuration=Release /t:Clean,Build /fl /flp:logfile=build\build.log
        if ($LASTEXITCODE -ne 0) { throw "Build failed." }

    - name: Package PLGX and ZIP
      run: |
        $version = "${{ steps.version.outputs.version }}"
        Copy-Item KeeAnywhere\bin\Release\KeeAnywhere.plgx build\dist\KeeAnywhere-$version.plgx

        # same 7-Zip as build.cmd (NuGet package 7-Zip.CommandLine)
        $zip = (Get-ChildItem packages\7-Zip.CommandLine.*\tools\7za.exe | Sort-Object FullName | Select-Object -Last 1).FullName
        if (-not $zip) { throw "7za.exe not found in packages\7-Zip.CommandLine.*" }
        Push-Location KeeAnywhere\bin\Release
        & $zip a -tzip "..\..\..\build\dist\KeeAnywhere-$version.zip" '-x!*.plgx' '-x!*.pdb' '-x!*.xml' '-x!*.config' '-x!KeePass.*'
        $exit = $LASTEXITCODE
        Pop-Location
        if ($exit -ne 0) { throw "7-Zip failed." }

    - name: Package Chocolatey
      run: |
        Copy-Item chocolatey build\chocolatey -Recurse
        # the Chocolatey package contains the DLL version (content of the ZIP file)
        $zip = (Get-ChildItem packages\7-Zip.CommandLine.*\tools\7za.exe | Sort-Object FullName | Select-Object -Last 1).FullName
        & $zip x "build\dist\KeeAnywhere-${{ steps.version.outputs.version }}.zip" -obuild\chocolatey\tools\KeeAnywhere
        if ($LASTEXITCODE -ne 0) { throw "7-Zip failed." }
        choco pack build\chocolatey\keepass-plugin-keeanywhere.nuspec --version ${{ steps.version.outputs.version }} --outputdirectory build\dist
        if ($LASTEXITCODE -ne 0) { throw "choco pack failed." }

    - name: Create checksums
      run: |
        $files = @(Get-ChildItem build\dist -File | Where-Object Name -ne 'SHA256SUMS.txt')
        if ($files.Count -eq 0) { throw "No files in build\dist." }
        $files |
          ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
          Set-Content build\dist\SHA256SUMS.txt -Encoding ascii
        Get-Content build\dist\SHA256SUMS.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.version.outputs.artifact }}
        path: build/dist

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log
        path: build/build.log
        if-no-files-found: ignore

  # Tags v* only: create a DRAFT GitHub release with the build artifacts and the CHANGELOG section.
  # Review and publish it manually - publishing triggers chocolatey.yml.
  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v7

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build.outputs.artifact }}
        path: dist

    - name: Release notes from CHANGELOG.md
      id: notes
      run: |
        $version = "${{ needs.build.outputs.version }}"
        $prerelease = $version -match '-'
        $baseVersion = ($version -split '-')[0]
        $lines = Get-Content CHANGELOG.md

        # Section of exactly this version; for pre-releases (e.g. 2.2.0-beta) fall back to the
        # section of the base version (2.2.0), which may still be "unreleased".
        $candidates = @($version)
        if ($prerelease) { $candidates += $baseVersion }
        $start = -1
        foreach ($candidate in $candidates) {
          $head = "^## " + [regex]::Escape($candidate) + " \("
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $head) { $start = $i; break } }
          if ($start -ge 0) { break }
        }
        if ($start -lt 0) { throw "CHANGELOG.md has no section '## $($candidates -join "' or '## ") (...)'." }
        if (-not $prerelease -and $lines[$start] -notmatch '\(\d{4}-\d{2}-\d{2}\)') {
          throw "CHANGELOG.md section of $version has no release date: '$($lines[$start])'"
        }
        $end = $lines.Count
        for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
        $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
        if ($prerelease) {
          $notes = "**Pre-release of KeeAnywhere $baseVersion for testing - not for production use.**`n`n" + $notes
        }
        $notes += "`n`n[Full Changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"
        Set-Content notes.md $notes -Encoding utf8
        Get-Content notes.md

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "${{ github.ref_name }}"
        $version = "${{ needs.build.outputs.version }}"
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists - nothing is overwritten." }
        $ghArgs = @($tag) + @(Get-ChildItem dist -File | ForEach-Object FullName) +
                  @('--draft', '--verify-tag', '--title', "KeeAnywhere $version", '--notes-file', 'notes.md')
        if ($version -match '-') { $ghArgs += '--prerelease' }
        gh release create @ghArgs
        if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
