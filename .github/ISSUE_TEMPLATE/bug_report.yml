name: Bug report
description: Report a problem with KeeAnywhere
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Security vulnerabilities must not be reported as public issue** - please follow the [security policy](https://github.com/Kyrodan/KeeAnywhere/security/policy) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I use the [latest version](https://github.com/Kyrodan/KeeAnywhere/releases/latest) of KeeAnywhere.
          required: true
        - label: I checked the [FAQ](https://keeanywhere.de/use/faq), [Known Issues](https://keeanywhere.de/use/known_issues) and the [existing issues](https://github.com/Kyrodan/KeeAnywhere/issues).
          required: true

  - type: dropdown
    id: provider
    attributes:
      label: Storage provider
      description: Which storage provider(s) are affected?
      multiple: true
      options:
        - Amazon S3 (or compatible)
        - Azure Blob Storage
        - Azure File Storage
        - Box
        - Dropbox
        - Dropbox (restricted)
        - Google Cloud Storage
        - Google Drive
        - Google Drive (restricted)
        - HiDrive
        - OneDrive
        - Not provider specific
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to 'Tools - KeeAnywhere Settings...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The complete error message as text. In most error dialogs you can copy the text with Ctrl+C. Screenshots can be added below.
      render: text

  - type: input
    id: keeanywhere-version
    attributes:
      label: KeeAnywhere version
      placeholder: e.g. 2.2.1
    validations:
      required: true

  - type: input
    id: keepass-version
    attributes:
      label: KeePass version
      placeholder: e.g. 2.62 (64-bit)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, other KeePass plugins, proxy, account storage location, offline cache or backup settings - anything that might help.
